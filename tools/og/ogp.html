<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- リンクプレビュー（OGP）画像 1200x630 のレイアウト。build.mjs が ?photo= に元動画のフレームを渡してスクリーンショットする -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=block" rel="stylesheet">
<style>
  :root {
    --blue: #00467F;
    --ink: #0b1d33;
    --cyan: #3fd0ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ink); }
  #card { position: relative; width: 1200px; height: 630px; font-family: 'Noto Sans JP', sans-serif; color: #fff; }
  #photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* 下側に文字を載せるための濃紺グラデーション */
  #shade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(11, 29, 51, 0) 38%, rgba(11, 29, 51, .55) 62%, rgba(11, 29, 51, .92) 100%);
  }
  /* チャットのサムネイルは中央の正方形（幅630px）に切り抜かれることがあるため、文字は中央寄せで幅600px以内に収める */
  #copy { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; }
  .kicker { font-size: 30px; font-weight: 700; letter-spacing: .08em; color: var(--cyan); }
  .title { margin-top: 2px; font-size: 80px; font-weight: 900; line-height: 1.12; letter-spacing: .04em; text-shadow: 0 4px 18px rgba(0, 0, 0, .35); }
  .sub { margin-top: 12px; font-size: 32px; font-weight: 700; }
  .chip { padding: 4px 18px 6px; border-radius: 999px; background: var(--cyan); color: #002a4d; font-weight: 900; }
  #brand {
    position: absolute; top: 28px; right: 32px; padding: 8px 18px; border-radius: 6px;
    background: rgba(11, 29, 51, .72); font-size: 22px; font-weight: 700; letter-spacing: .06em;
  }
</style>
</head>
<body>
<div id="card">
  <img id="photo" alt="">
  <div id="shade"></div>
  <div id="brand">岩代工業株式会社</div>
  <div id="copy">
    <div class="kicker">局所排気・ダクト保持に</div>
    <div class="title">サポートアーム</div>
    <div class="sub"><span class="chip">3関節＋1伸縮</span></div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const img = document.getElementById('photo');
  img.src = q.get('photo');
  if (q.get('pos')) img.style.objectPosition = q.get('pos');
  window.ready = Promise.all([
    document.fonts.ready,
    new Promise((ok) => (img.complete ? ok() : img.addEventListener('load', ok))),
  ]);
</script>
</body>
</html>
